<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:fragment="sidebar">
    <div id="sidebar">

        <!-- Logo -->
        <div class="sidebar-brand">
            <img th:src="@{/images/logo.svg}" alt="PediuPatrão" style="width: 100%; max-width: 200px; display: block; margin: 0 auto;">
        </div>

        <ul class="nav flex-column px-2">

            <!-- Home -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/}">
                    <i class="bi bi-house-fill me-2"></i>
                    <span class="d-none d-md-inline">Home</span>
                </a>
            </li>

            <!-- Clientes -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/clientes}">
                    <i class="bi bi-person-raised-hand me-2"></i>
                    <span class="d-none d-md-inline">Clientes</span>
                </a>
            </li>

            <!-- Pedidos -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/pedidos}">
                    <i class="bi bi-bag-fill me-2"></i>
                    <span class="d-none d-md-inline">Pedidos</span>
                </a>
            </li>

            <!-- Produtos -->
            <li class="nav-item" th:if="${#authorization.expression('hasAnyAuthority(''ADMIN'', ''ROLE_ADMIN'', ''GERENTE'', ''ROLE_GERENTE'')')}">
                <a class="nav-link sidebar-link" th:href="@{/produtos}">
                    <i class="bi bi-boxes me-2"></i>
                    <span class="d-none d-md-inline">Produtos</span>
                </a>
            </li>

            <!-- Auditoria -->
            <li class="nav-item" th:if="${#authorization.expression('hasAnyAuthority(''ADMIN'', ''ROLE_ADMIN'', ''GERENTE'', ''ROLE_GERENTE'')')}">
                <a class="nav-link sidebar-link" th:href="@{/auditoria}">
                    <i class="bi bi-journal-text me-2"></i>
                    <span class="d-none d-md-inline">Auditoria</span>
                </a>
            </li>

            <!-- Usuários -->
            <li class="nav-item" th:if="${#authorization.expression('hasAnyAuthority(''ADMIN'', ''ROLE_ADMIN'')')}">
                <a class="nav-link sidebar-link" th:href="@{/usuarios}">
                    <i class="bi bi-people-fill me-2"></i>
                    <span class="d-none d-md-inline">Usuários</span>
                </a>
            </li>

        </ul>

        <!-- Informação do Utilizador e Logout -->
        <div class="sidebar-footer" th:if="${#authorization.expression('isAuthenticated()')}">
            <div class="mb-2 text-white small text-truncate">
                <i class="bi bi-person-circle me-1"></i> <span th:text="${#authentication.name}">Utilizador</span>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                    <i class="bi bi-box-arrow-right me-1"></i> Sair
                </button>
            </form>
        </div>

    </div>
</div>

<style>
    #sidebar {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: linear-gradient(180deg, #1e2330 0%, #252d3d 100%);
        border-right: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar-brand {
        padding: 1rem 1rem 0.5rem;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        margin-bottom: 0.5rem;
    }

    .sidebar-link {
        color: rgba(255,255,255,0.6) !important;
        border-radius: 8px;
        padding: 0.55rem 0.85rem;
        margin-bottom: 2px;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }

    .sidebar-link:hover {
        background-color: rgba(255,255,255,0.08) !important;
        color: #fff !important;
    }

    .sidebar-divider {
        border-color: rgba(255,255,255,0.08);
        margin: 0.4rem 0.5rem;
    }

    .sidebar-section-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.3);
        padding: 0.2rem 1rem 0.4rem;
    }

    .sidebar-footer {
        margin-top: auto;
        padding: 1rem 1.2rem;
        font-size: 0.78rem;
        border-top: 1px solid rgba(255,255,255,0.06);
        background-color: rgba(0,0,0,0.1);
    }
</style>
</body>
</html>
