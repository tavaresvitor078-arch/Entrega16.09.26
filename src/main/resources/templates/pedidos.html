<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Valor Total</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${pedido.usuarioResponsavel}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Ações de avanço de status -->
                            <form th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline" th:if="${pedido.status != 'CANCELADO' and pedido.status != 'FINALIZADO'}">
                                <input type="hidden" name="status" th:value="${pedido.status == 'RECEBIDO' ? 'EM_PREPARACAO' : (pedido.status == 'EM_PREPARACAO' ? 'PRONTO' : (pedido.status == 'PRONTO' ? 'SAIU_PARA_ENTREGA' : 'FINALIZADO'))}" />
                                <button type="submit" class="btn btn-sm btn-outline-primary me-1">Avançar</button>
                            </form>
                            <!-- Cancelamento -->
                            <form th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline" th:if="${pedido.status != 'CANCELADO' and pedido.status != 'FINALIZADO'}">
                                <input type="hidden" name="status" value="CANCELADO" />
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Deseja realmente cancelar este pedido?')">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
