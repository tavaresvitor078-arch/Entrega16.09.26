<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag-plus me-2 text-primary"></i>Novo Pedido
        </h2>
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">
                
                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-bold">Cliente</label>
                    <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                        <option value="">Selecione um cliente...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="desconto" class="form-label fw-bold">Desconto</label>
                    <input type="number" step="0.01" class="form-control" id="desconto" th:field="*{desconto}" placeholder="0.00" />
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Pedido</button>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
