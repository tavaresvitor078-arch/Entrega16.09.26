<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
</head>
<body>
    <div th:fragment="content">
        <div class="container-fluid px-4">
            <h1 class="mt-4" th:text="${produto.id == null ? 'Novo Produto' : 'Editar Produto'}"></h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/produtos}">Produtos</a></li>
                <li class="breadcrumb-item active">Cadastro</li>
            </ol>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome:</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" required />
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo:</label>
                            <input type="text" class="form-control" id="tipo" th:field="*{tipo}" required />
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço:</label>
                            <input type="number" class="form-control" id="preco" th:field="*{preco}" step="0.01" required />
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="ativo" th:field="*{ativo}" />
                            <label class="form-check-label" for="ativo">Ativo</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
